{% set name = "cg2at" %}
{% set version = "1.0.0" %}  # keep in step with pyproject.toml and database/bin/g_var.py

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  git_rev: "v{{ version }}"
  git_url: https://github.com/pstansfeld/cg2at

requirements:
  run:
    - python >=3.9
    - numpy >=1.26.4
    - scipy
  run_constrained:
    # optional, only needed for -refine, cg2at_refine and traj_dih_guide
    - mdanalysis >=2.0

build:
  number: {{ environ.get("GIT_DESCRIBE_NUMBER", 0) }}
  script_env:
    - CONDA_BLD_PATH
    - package
  noarch: generic

about:
  home: https://github.com/pstansfeld/cg2at
  license: GPL-3.0
  license_file: LICENSE
  summary: "CG2AT2: fragment-based conversion of coarse-grained (e.g. Martini) systems to atomistic resolution."

extra:
  maintainers:
    - Owen Vickery
    - Phillip Stansfeld
